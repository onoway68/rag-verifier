name: RAG Verifier Unit Gate

on:
  push:
  pull_request:

jobs:
  verifier-unit-tests:
    name: Deterministic verifier tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deterministic test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Prove ML runtime is not imported
        run: |
          python - <<'PY'
          import sys

          from verifier import RAGVerifier
          from nli_provider import FakeNLIProvider

          verifier = RAGVerifier(
              chunks={"x": "Evidence."},
              retrieved_ids={"x"},
              nli_provider=FakeNLIProvider()
          )

          assert "torch" not in sys.modules
          assert "transformers" not in sys.modules

          print("Deterministic verifier is ML-runtime independent.")
          PY

      - name: Run deterministic verifier gate
        run: |
          python -m pytest -m "not integration" -v
